[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isoprax-reference"
version = "0.1.0"
description = "Isoprax v0.3 cross-family conformance reference implementation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2",
]

[dependency-groups]
dev = [
  "diff-cover>=9,<10",
  "hypothesis>=6,<7",
  "mutmut>=3,<4",
  "pip-audit>=2,<3",
  "pre-commit>=4,<5",
  "pytest>=9,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=isoprax",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]
filterwarnings = ["error::ResourceWarning"]

[tool.mutmut]
source_paths = ["isoprax"]
pytest_add_cli_args = ["-o", "addopts=", "tests", "-q"]
mutate_only_covered_lines = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"isoprax/__init__.py" = ["F401"]
"examples/demo_cross_family.py" = ["E402"]

[tool.setuptools]
packages = ["isoprax"]
