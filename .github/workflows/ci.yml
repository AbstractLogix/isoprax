name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Verify lockfile
        run: uv lock --check

      - name: Dependency audit
        run: uv run pip-audit

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest tests -q --cov-report=xml

      - name: Per-module coverage
        run: uv run coverage json -o coverage.json && uv run python scripts/check_module_coverage.py coverage.json --minimum 95

      - name: Diff coverage
        if: github.event_name == 'pull_request'
        run: uv run diff-cover coverage.xml --compare-branch origin/${{ github.base_ref }} --fail-under 95

      - name: Demo smoke test
        run: uv run python examples/demo_cross_family.py
