name: Haskell semantics kernel

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@96f3dafd067155f32643c2a0757ab71d2910e2c2 # v2.8.0
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.16.1.0"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Build Haskell library, CLI, and properties
        working-directory: haskell/isoprax-kernel
        run: cabal build all --enable-tests

      - name: Run QuickCheck properties
        working-directory: haskell/isoprax-kernel
        run: cabal test all --enable-tests

      - name: Check compile-time evidence requirements
        working-directory: haskell/isoprax-kernel
        run: bash test/compile-fail.sh

      - name: Set up Python reference environment
        run: uv sync --group dev

      - name: Locate kernel executable
        working-directory: haskell/isoprax-kernel
        run: echo "ISOPRAX_KERNEL_BIN=$(cabal list-bin isoprax-kernel)" >> "$GITHUB_ENV"

      - name: Compare Python and Haskell fixtures
        run: uv run pytest --no-cov -q tests/test_haskell_differential.py

      - name: Benchmark subprocess boundary
        run: uv run python scripts/benchmark_haskell_kernel.py --iterations 100
