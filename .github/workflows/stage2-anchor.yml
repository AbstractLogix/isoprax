name: Stage 2 anchor artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "stage2-anchor-*"

permissions: {}

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Create Stage 2 bundle
        run: >-
          uv run python scripts/create_stage2_anchor_attestation.py
          docs/stage2/whoami-pilot-predeclaration-v3.json
          --bundle dist/whoami-pilot-predeclaration-v3.sigstore.json
          --oidc-client-id sigstore

      - name: Record bundle digest
        run: sha256sum dist/whoami-pilot-predeclaration-v3.sigstore.json

      - name: Upload signed bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whoami-pilot-predeclaration-v3-sigstore-bundle
          path: dist/whoami-pilot-predeclaration-v3.sigstore.json
          if-no-files-found: error
