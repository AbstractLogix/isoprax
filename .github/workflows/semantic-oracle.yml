name: Semantic oracle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect semantic contract changes
        id: semantic-paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"
          fi
          if [[ "$base" =~ ^0+$ ]]; then
            base="${head}^"
          fi
          if git diff --quiet "$base" "$head" -- \
            isoprax/commensurability.py \
            isoprax/semantic_types.py \
            isoprax/evaluation.py \
            tests/test_commensurability.py \
            tests/test_semantic_types.py \
            tests/test_haskell_semantic_oracle.py \
            tests/reference/semantic-oracle/ \
            haskell/semantic-oracle/ \
            specs/043-python-semantic-types/ \
            .github/workflows/semantic-oracle.yml; then
            echo "semantic=false" >> "$GITHUB_OUTPUT"
            echo "No semantic contract paths changed; skipping GHC and Cabal."
          else
            echo "semantic=true" >> "$GITHUB_OUTPUT"
            echo "Semantic contract paths changed; running the oracle."
          fi

      - name: Set up GHC and Cabal
        if: steps.semantic-paths.outputs.semantic == 'true'
        uses: haskell-actions/setup@96f3dafd067155f32643c2a0757ab71d2910e2c2 # v2.8.0
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.16.1.0"

      - name: Build Haskell oracle
        if: steps.semantic-paths.outputs.semantic == 'true'
        working-directory: haskell/semantic-oracle
        run: cabal build all --enable-tests

      - name: Run QuickCheck properties
        if: steps.semantic-paths.outputs.semantic == 'true'
        working-directory: haskell/semantic-oracle
        run: cabal test all --enable-tests

      - name: Check opaque evidence compile failures
        if: steps.semantic-paths.outputs.semantic == 'true'
        working-directory: haskell/semantic-oracle
        run: bash test/compile-fail.sh

      - name: Set up Python and uv
        if: steps.semantic-paths.outputs.semantic == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python reference environment
        if: steps.semantic-paths.outputs.semantic == 'true'
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Install Python dependencies
        if: steps.semantic-paths.outputs.semantic == 'true'
        run: uv sync --group dev

      - name: Locate Haskell oracle executable
        if: steps.semantic-paths.outputs.semantic == 'true'
        working-directory: haskell/semantic-oracle
        run: echo "ISOPRAX_SEMANTIC_ORACLE_BIN=$(cabal list-bin semantic-oracle)" >> "$GITHUB_ENV"

      - name: Compare Python and Haskell semantic fixtures
        if: steps.semantic-paths.outputs.semantic == 'true'
        run: uv run pytest -q --no-cov tests/test_haskell_semantic_oracle.py
